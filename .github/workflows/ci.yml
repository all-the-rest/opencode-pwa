name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` key: package.json `packageManager: pnpm@10.0.0` wins.
        # Setting both fails with ERR_PNPM_BAD_PM_VERSION (CI run 37371470039).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        # No `cache: pnpm`: setup-node calls `pnpm store path --silent`,
        # which fails on pnpm 10 ("packages field missing or empty",
        # CI run 37372351400). pnpm/action-setup caches nothing; the
        # install step is fast enough without cache.

      - name: Install dependencies
        # Build approvals for esbuild/msgpackr-extract come from pnpm-workspace.yaml.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (chromium only)
        run: pnpm exec playwright test --grep @smoke --project=chromium
